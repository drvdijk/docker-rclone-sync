name: Docker Image Release

on:
  release:
    types:
      - published

env:
  IMAGE: drvdijk/rclone-sync

jobs:
  build:
    name: Lint, build and push release image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0

      # Release tags are "vX.Y.Z"; Docker tags drop the "v".
      - name: Determine version tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Read expected rclone version from Dockerfile
        id: rclone_version
        run: |
          version=$(grep -m1 '^ARG RCLONE_VERSION=' Dockerfile | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and export to Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci

      - name: Smoke test - show version with an empty config
        run: docker run --rm ${{ env.IMAGE }}:ci

      - name: Smoke test - expected rclone version is present
        run: |
          docker run --rm ${{ env.IMAGE }}:ci | grep -F "rclone v${{ steps.rclone_version.outputs.version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest

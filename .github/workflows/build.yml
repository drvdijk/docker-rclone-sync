name: Docker Image CI

on:
  push:

env:
  IMAGE: drvdijk/rclone-sync

jobs:
  build:
    name: Build docker-rclone-sync image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0

      - name: Read expected rclone version from Dockerfile
        id: rclone_version
        run: |
          version=$(grep -m1 '^ARG RCLONE_VERSION=' Dockerfile | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and export to Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci

      - name: Smoke test - show version with an empty config
        run: docker run --rm ${{ env.IMAGE }}:ci

      - name: Smoke test - expected rclone version is present
        run: |
          docker run --rm ${{ env.IMAGE }}:ci | grep -F "rclone v${{ steps.rclone_version.outputs.version }}"

      # master pushes :edge; every other branch gets its own (sanitized)
      # branch-name tag, e.g. "modernize-image" -> :modernize-image. A tag
      # push (release.yml's trigger) matches neither rule below, so `tags`
      # comes out empty and the push steps are skipped for that case.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge
            type=ref,event=branch,enable=${{ github.ref_name != github.event.repository.default_branch }}

      - name: Set up QEMU
        if: steps.meta.outputs.tags != ''
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.meta.outputs.tags != ''
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: steps.meta.outputs.tags != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.meta.outputs.tags != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

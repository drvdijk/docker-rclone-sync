name: Docker Image CI

on:
  push:

env:
  IMAGE: drvdijk/rclone-sync

jobs:
  build:
    name: Build docker-rclone-sync image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0

      - name: Read expected rclone version from Dockerfile
        id: rclone_version
        run: |
          version=$(grep -m1 '^ARG RCLONE_VERSION=' Dockerfile | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and export to Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci

      - name: Smoke test - show version with an empty config
        run: docker run --rm ${{ env.IMAGE }}:ci

      - name: Smoke test - expected rclone version is present
        run: |
          docker run --rm ${{ env.IMAGE }}:ci | grep -F "rclone v${{ steps.rclone_version.outputs.version }}"

      # Only push from master, and only once the above build/lint/smoke
      # test steps have passed. Other branches stop here.
      - name: Set up QEMU
        if: github.ref == 'refs/heads/master'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/master'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push :edge
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:edge
